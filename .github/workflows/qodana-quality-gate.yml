
name: Qodana Community - Java Code Smells

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  qodana:
    name: Detect Java code smells
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Community Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --profile-path .qodana/profiles/java-code-smells.yaml
          upload-result: true
          pr-mode: false
          post-pr-comment: false

      - name: Check code smell findings
        if: always()
        shell: bash
        run: |
          REPORT="${RUNNER_TEMP}/qodana/results/qodana.sarif.json"

          if [ ! -f "$REPORT" ]; then
            echo "::error::SARIF report not found at $REPORT"
            echo "Searching for SARIF reports..."
            find "$RUNNER_TEMP/qodana" -type f -name '*.sarif*' || true
            exit 1
          fi

          python - "$REPORT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              sarif = json.load(f)

          targets = {
              "ClassWithTooManyMethods",
              "MethodCount",
              "CyclomaticComplexity",
          }

          findings = []

          for run in sarif.get("runs", []):
              rules = {
                  rule.get("id"): rule
                  for rule in run.get("tool", {})
                               .get("driver", {})
                               .get("rules", [])
              }

              print("Rule IDs reported by Qodana:")
              for rule_id, rule in rules.items():
                  name = rule.get("name", "")
                  desc = rule.get("shortDescription", {}).get("text", "")
                  print(f"  {rule_id}: {name} - {desc}")

              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "")
                  rule = rules.get(rule_id, {})
                  name = rule.get("name", "")
                  desc = rule.get("shortDescription", {}).get("text", "")

                  text = f"{rule_id} {name} {desc}".lower()

                  if (
                      rule_id in targets
                      or "class with too many methods" in text
                  ):
                      findings.append(result)

          if findings:
              print(
                  f"FAILED: {len(findings)} class-with-too-many-methods "
                  "finding(s) detected."
              )

              for result in findings:
                  message = result.get("message", {}).get("text", "")
                  locations = result.get("locations", [])

                  if locations:
                      physical = locations[0].get(
                          "physicalLocation", {}
                      )
                      uri = physical.get(
                          "artifactLocation", {}
                      ).get("uri", "unknown file")
                      line = physical.get("region", {}).get(
                          "startLine", "?"
                      )
                      print(f"- {uri}:{line}: {message}")
                  else:
                      print(f"- {message}")

              sys.exit(1)

          print("PASSED: No targeted code smell findings.")
          PY
