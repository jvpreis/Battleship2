
name: Qodana Community - Overly Complex Method

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  qodana:
    name: Detect overly complex methods
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Community Scan
        id: qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --profile-path .qodana/profiles/overly-complex-method.yaml
          upload-result: true
          pr-mode: false
          post-pr-comment: false

      - name: Check cyclomatic complexity results
        if: always()
        shell: bash
        run: |
          REPORT="${RUNNER_TEMP}/qodana/results/qodana.sarif.json"

          if [ ! -f "$REPORT" ]; then
            echo "::error::Qodana SARIF report was not generated."
            exit 1
          fi

          python - "$REPORT" <<'PY'
          import json
          import sys

          report_path = sys.argv[1]

          with open(report_path, encoding="utf-8") as f:
              sarif = json.load(f)

          results = [
              result
              for run in sarif.get("runs", [])
              for result in run.get("results", [])
              if result.get("ruleId") == "CyclomaticComplexity"
          ]

          if results:
              print(
                  f"FAILED: Found {len(results)} method(s) "
                  "exceeding the configured cyclomatic complexity limit."
              )

              for result in results:
                  message = result.get("message", {}).get("text", "")
                  locations = result.get("locations", [])

                  if locations:
                      physical = locations[0].get(
                          "physicalLocation", {}
                      )
                      artifact = physical.get("artifactLocation", {})
                      uri = artifact.get("uri", "unknown file")
                      region = physical.get("region", {})
                      line = region.get("startLine", "?")
                      print(f"- {uri}:{line}: {message}")
                  else:
                      print(f"- {message}")

              sys.exit(1)

          print(
              "PASSED: No CyclomaticComplexity findings "
              "were reported."
          )
          PY
